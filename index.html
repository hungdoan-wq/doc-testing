<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Markdown Docs</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
:root {
  --bg: white;
  --border: #e5e7eb;
  --text: #111827;
  --muted: #6b7280;
  --primary: #6366f1;
  --success-bg: #e8f5e9;
  --success-border: #2e7d32;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--text);
  background: var(--bg);
}

/* Top bar */
.topbar {
  height: 56px;
  background: white;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  font-weight: 600;
}

/* App layout */
.app {
  display: flex;
  height: calc(100vh - 56px);
}

/* Sidebar */
#sidebar {
  width: 280px;
  background: white;
  border-right: 1px solid var(--border);
  padding: 16px;
  overflow-y: auto;
  scrollbar-width: none;
}

/* Sidebar items */
.item {
  padding: 8px 8px;
  border-radius: 6px;
  cursor: pointer;
  color: var(--text);
}

.item:hover {
  background: #f3f4f6;
}

.item.active {
  background: #eef2ff;
  color: var(--primary);
}
.item.nested {
  padding: 8px 0px;
  margin-left: 0px;
}

.section {
  margin-top: 16px;
  margin-bottom: 16px;
  font-size: 12px;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}

.nested {
  margin-left: 12px;
  font-size: 14px;
}
.section {
  cursor: pointer;
  user-select: none;
}

.section::after {
  content: "▾";
  float: right;
}

.section.collapsed::after {
  transform: rotate(-90deg);
}

.section-children {
  overflow: hidden;
  padding-left: 16px;
  opacity: 1;
  transform: translateY(0);
  transition:
    max-height 0.3s ease,
    opacity 0.5s ease,
    transform 0.5s ease;
}

.section-children.collapsed {
  max-height: 0;
  opacity: 0;
  transform: translateY(-4px);
}


/* Content */
#content {
  flex: 1;
  padding: 32px;
  overflow-y: auto;
}

#content > * {
  max-width: 860px;
}

/* Markdown typography */
#content h1 {
  font-size: 36px;
  margin-bottom: 12px;
}

#content h2 {
  margin-top: 32px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
}

#content p {
  line-height: 1.7;
  color: #374151;
}

/* Callout (REQUIREMENTS-style) */
.callout {
  display: flex;
  gap: 12px;
  border-left: 4px solid var(--success-border);
  background: var(--success-bg);
  padding: 16px;
  border-radius: 6px;
  margin: 24px 0;
}

.callout strong {
  text-transform: uppercase;
  font-size: 13px;
}
/* TOC */
#toc {
  width: 240px;
  position: absolute;
  right: 0;
  height: calc(100vh - 56px);
  border-left: 1px solid var(--border);
  padding: 24px 16px;
  background: white;
  overflow-y: auto;
  font-size: 14px;
}

#toc .toc-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 12px;
}

.toc-item {
  cursor: pointer;
  color: #374151;
  padding: 4px 0;
}

.toc-item.level-3 {
  padding-left: 12px;
  font-size: 13px;
}

.toc-item:hover {
  color: var(--primary);
}

.toc-item.active {
  color: var(--primary);
  font-weight: 500;
}

/* Make content narrower since we added TOC */
#content {
  max-width: 80%;
}

</style>

</head>

<body>

<header class="topbar">
  <div class="logo">My Docs</div>
</header>

<div class="app">
  <aside id="sidebar"></aside>
  <main id="content"></main>
  <aside id="toc"></aside>
</div>

<script>
const sidebar = document.getElementById("sidebar");
const content = document.getElementById("content");

/* ---------------------------
   Load tree + init
---------------------------- */
fetch("docs_structure.json")
  .then(r => r.json())
  .then(tree => {
    buildSidebar(tree);
    loadFromHash();
  });

/* ---------------------------
   Sidebar rendering
---------------------------- */
function buildSidebar(tree) {
  sidebar.innerHTML = "";
  renderNode(tree, sidebar, 0);
}

function renderNode(node, container, depth) {
  Object.entries(node).forEach(([title, value]) => {

    /* ---------------------------
       Leaf markdown doc
       --------------------------- */
    if (typeof value === "string") {
      container.appendChild(linkItem(title, value, depth > 0));
      return;
    }

    /* ---------------------------
       Section
       --------------------------- */
    const section = document.createElement("div");
    section.className = "section";
    section.textContent = title;
    container.appendChild(section);

    const childrenWrap = document.createElement("div");
    childrenWrap.className = "section-children collapsed";
    container.appendChild(childrenWrap);

    // Toggle collapse
    section.onclick = () => {
      const collapsed = childrenWrap.classList.toggle("collapsed");
      section.classList.toggle("collapsed", collapsed);
    };

    // No children or empty placeholder
    if (!value.children || value.children === "") {
      return;
    }

    // Recurse
    renderNode(value.children, childrenWrap, depth + 1);
  });
}
/* ---------------------------
   Sidebar item
---------------------------- */
function linkItem(label, path, nested = false) {
  const div = document.createElement("div");
  div.textContent = label;
  div.className = "item" + (nested ? " nested" : "");
  div.dataset.path = path;

  div.onclick = () => {
    location.hash = path;
  };

  return div;
}

/* ---------------------------
   Routing
---------------------------- */
function loadFromHash() {
  const file = location.hash.slice(1);
  if (file) loadMarkdown(file);
}

window.addEventListener("hashchange", loadFromHash);

/* ---------------------------
   Markdown loading
---------------------------- */
function loadMarkdown(file) {
  fetch(file)
    .then(r => r.text())
    .then(md => {
      content.innerHTML = marked.parse(md);
      highlightActive(file);
      rewriteLinks();
      buildTOC();
      observeHeadings();
    })
    .catch(() => {
      content.innerHTML = "<p>Document not found.</p>";
    });
}

/* ---------------------------
   Active highlight
---------------------------- */
function highlightActive(path) {
  document.querySelectorAll(".item").forEach(el => {
    const isActive = el.dataset.path === path;
    el.classList.toggle("active", isActive);

    if (isActive) {
      const children = el.closest(".section-children");
      if (children && children.classList.contains("collapsed")) {
        children.classList.remove("collapsed");
        children.previousSibling.classList.remove("collapsed");
      }
    }
  });
}


/* ---------------------------
   Rewrite MD links
---------------------------- */
function rewriteLinks() {
  content.querySelectorAll("a").forEach(a => {
    const href = a.getAttribute("href");
    if (href && href.endsWith(".md")) {
      a.onclick = e => {
        e.preventDefault();
        location.hash = href;
      };
    }
  });
}
function buildTOC() {
  const toc = document.getElementById("toc");
  toc.innerHTML = "";

  const headings = content.querySelectorAll("h2, h3");
  if (!headings.length) return;

  const title = document.createElement("div");
  title.className = "toc-title";
  title.textContent = "On this page";
  toc.appendChild(title);

  headings.forEach(h => {
    if (!h.id) {
      h.id = h.textContent
        .toLowerCase()
        .replace(/[^\w]+/g, "-");
    }

    const item = document.createElement("div");
    item.className = `toc-item level-${h.tagName === "H3" ? 3 : 2}`;
    item.textContent = h.textContent;

    item.onclick = () => {
      document.getElementById(h.id).scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    };

    toc.appendChild(item);
  });
}
function observeHeadings() {
  const tocItems = document.querySelectorAll(".toc-item");
  const headings = content.querySelectorAll("h2, h3");

  const observer = new IntersectionObserver(
    entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          tocItems.forEach(i => i.classList.remove("active"));
          const active = [...tocItems].find(
            i => i.textContent === entry.target.textContent
          );
          if (active) active.classList.add("active");
        }
      });
    },
    {
      rootMargin: "-40% 0px -55% 0px"
    }
  );

  headings.forEach(h => observer.observe(h));
}

</script>



</body>
</html>
